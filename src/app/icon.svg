<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- deep space background -->
  <rect width="32" height="32" rx="8" fill="#0a0d14"/>

  <!-- ring shadow behind planet -->
  <ellipse cx="16" cy="17" rx="13" ry="4.2" fill="#0a0d14" opacity="0.6"/>

  <!-- ring back half (behind planet) -->
  <ellipse cx="16" cy="16.6" rx="12.4" ry="3.8"
    stroke="#c9a84c" stroke-width="1.6" fill="none"
    stroke-dasharray="19.5 19.5" stroke-dashoffset="0"
    opacity="0.55"/>

  <!-- planet body -->
  <circle cx="16" cy="16" r="7.2" fill="url(#saturn-grad)"/>

  <!-- subtle band on planet -->
  <ellipse cx="16" cy="14.8" rx="6.8" ry="1.4" fill="#c9a84c" opacity="0.10"/>
  <ellipse cx="16" cy="17.4" rx="6.8" ry="1.2" fill="#c9a84c" opacity="0.07"/>

  <!-- ring front half (over planet) -->
  <ellipse cx="16" cy="16.6" rx="12.4" ry="3.8"
    stroke="#F8E16C" stroke-width="1.6" fill="none"
    stroke-dasharray="19.5 19.5" stroke-dashoffset="19.5"
    opacity="0.85"/>

  <!-- tiny star accents -->
  <circle cx="4"  cy="5"  r="0.6" fill="#ffffff" opacity="0.7"/>
  <circle cx="27" cy="7"  r="0.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="25" cy="27" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="6"  cy="26" r="0.4" fill="#ffffff" opacity="0.45"/>

  <defs>
    <radialGradient id="saturn-grad" cx="38%" cy="35%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#e8c87a"/>
      <stop offset="45%"  stop-color="#c9973e"/>
      <stop offset="100%" stop-color="#7a5520"/>
    </radialGradient>
  </defs>
</svg>
